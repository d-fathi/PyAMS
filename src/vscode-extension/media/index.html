<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyAMS Editor</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: verdana;
        }
        #content {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    
    <script nonce="${nonce}">
        const vscode = acquireVsCodeApi();
        
        vscode.postMessage({ type: 'ready' });
        
        window.addEventListener('message', event => {
            const message = event.data;
            if (message.type === 'load') {
                window.fileContent = message.content;
                window.fileType = message.fileType;
                
                setTimeout(() => {
                    if (typeof drawing !== 'undefined') {
                        drawing.setSymbol(window.fileContent);
                        drawing.setFileType(window.fileType);
                    }
                }, 100);
            }
        });
    </script>
    
    <script nonce="${nonce}" src="${rulerJs}"></script>
    <script nonce="${nonce}" src="${gridJs}"></script>
    <script nonce="${nonce}" src="${bodyJs}"></script>
    <script nonce="${nonce}" src="${drawingJs}"></script>
</body>
</html>
